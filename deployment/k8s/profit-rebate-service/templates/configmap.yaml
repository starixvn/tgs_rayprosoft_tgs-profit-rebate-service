apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "profit-rebate-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}"
      },
      "NatsSetting": {
        "Urls": "{{ .Values.nats.urls }}"
      },
      "ProfitRebate": {
        "CashBaseUrl": "http://cashservice-api",
        "PlayerServiceBaseUrl": "http://player-api"
      },
      "RabbitMQ": {
        "RabbitMQUrl": "{{ .Values.rabbit.url }}",
        "UserName": "{{ .Values.rabbit.user }}",
        "Password": "{{ .Values.rabbit.password }}",
        "VirtualHost": "{{ .Values.rabbit.vhost  }}"
      }
    }
